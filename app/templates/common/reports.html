{% extends 'base_app.html' %}
{% block title %}Reports{% endblock %}
{% block content %}
<p class="text-muted">Export live data from the database as PDF, CSV or Excel.</p>
<div class="row g-3">
  {% for key, (title, desc, _fn) in reports.items() %}
  <div class="col-md-6 col-xl-4"><div class="card h-100"><div class="card-body d-flex flex-column">
    <div class="d-flex gap-3"><div class="stat p-0"><div class="ico"><i class="bi bi-file-earmark-bar-graph"></i></div></div><div><h5 class="mb-1">{{ title }}</h5><p class="text-muted small mb-0">{{ desc }}</p></div></div>
    <div class="mt-auto pt-3 d-flex gap-2">
      <a class="btn btn-primary btn-sm" href="{{ url_for('reports.download', name=key, fmt='pdf') }}"><i class="bi bi-filetype-pdf me-1"></i>PDF</a>
      <a class="btn btn-soft btn-sm" href="{{ url_for('reports.download', name=key, fmt='xlsx') }}"><i class="bi bi-file-earmark-excel me-1"></i>Excel</a>
      <a class="btn btn-soft btn-sm" href="{{ url_for('reports.download', name=key, fmt='csv') }}"><i class="bi bi-filetype-csv me-1"></i>CSV</a>
    </div></div></div></div>
  {% endfor %}
</div>
{% endblock %}
