{% extends 'base_app.html' %}
{% from '_macros.html' import field %}
{% block title %}Broadcast notification{% endblock %}
{% block content %}
<div class="card" style="max-width:640px"><div class="card-body"><form method="post" novalidate>{{ form.hidden_tag() }}<div class="vstack gap-3">
  {{ field(form.audience) }}{{ field(form.title) }}{{ field(form.message, rows=4) }}<div><button class="btn btn-accent" data-confirm="Send this notification now?" data-loading="Sending...">Send notification</button></div></div></form></div></div>
{% endblock %}
